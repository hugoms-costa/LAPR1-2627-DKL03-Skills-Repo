<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>O meu perfil</title>
        <script>
            const tema = localStorage.getItem("tema") ?? "light";
            document.documentElement.setAttribute("data-bs-theme", tema);
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="icon" type="image/png" href="../img/favicon.png">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">BoleiaISEP</a>
                <button type="button" class="btn btn-link nav-link px-2 ms-auto order-lg-last" id="alternarTema" aria-label="Mudar para modo escuro">
                    <i class="bi bi-moon" id="iconeTema" aria-hidden="true"></i>
                </button>
                <a class="login me-2 order-lg-last" href="Login.html" aria-label="Entrar">
                    <span class="avatar avatar-sm avatar-login" aria-hidden="true">Login</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="Dar_Boleia.html">Dar Boleia</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Boleias.html">Boleias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Minhas_Viagens.html">As minhas viagens</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container mt-4 mb-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <span class="avatar avatar-lg" id="perfilIniciais" aria-hidden="true"></span>
                <div>
                    <h1 class="h4 mb-0" id="perfilNome"></h1>
                    <p class="text-body-secondary mb-0" id="perfilCurso"></p>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header fw-semibold">Dados da conta</div>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between gap-3">
                                <span class="text-body-secondary">Nome</span>
                                <span class="text-end" id="dadoNome"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between gap-3">
                                <span class="text-body-secondary">Curso</span>
                                <span class="text-end" id="dadoCurso"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between gap-3">
                                <span class="text-body-secondary">Email</span>
                                <span class="text-end text-break" id="dadoEmail"></span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card h-100">
                        <div class="card-header fw-semibold">Avaliações</div>
                        <div class="card-body">
                            <p class="mb-0">
                                <span class="fs-3 fw-semibold" id="mediaValor"></span>
                                <span class="text-body-secondary" id="mediaEscala">de 5</span>
                            </p>
                            <p class="estrelas mb-2" id="mediaEstrelas" aria-hidden="true"></p>
                            <p class="text-body-secondary small mb-0" id="mediaTotal"></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between gap-2">
                <a class="btn btn-outline-secondary" href="Minhas_Viagens.html">Ver as minhas viagens</a>
                <button type="button" class="btn btn-outline-danger" id="terminarSessao">Terminar sessão</button>
            </div>
        </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../script.js"></script>
    <script src="../js/perfil.js"></script>
    </body>
</html>
