<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Boleias</title>
        <script>
            const tema = localStorage.getItem("tema") ?? "light";
            document.documentElement.setAttribute("data-bs-theme", tema);
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="icon" type="image/png" href="../img/favicon.png">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">BoleiaISEP</a>
                <button type="button" class="btn btn-link nav-link px-2 ms-auto order-lg-last" id="alternarTema" aria-label="Mudar para modo escuro">
                    <i class="bi bi-moon" id="iconeTema" aria-hidden="true"></i>
                </button>
                <a class="login me-2 order-lg-last" href="Login.html" aria-label="Entrar">
                    <span class="avatar avatar-sm avatar-login" aria-hidden="true">Login</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="Dar_Boleia.html">Dar Boleia</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Boleias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Minhas_Viagens.html">As minhas viagens</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container mt-4 mb-5">
            <h1 class="h3 mb-1">Boleias</h1>

            <label for="pesquisa" class="text-body-secondary mb-2">Pesquisa por localidade</label>
            <div class="input-group mb-2">
                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                <input type="search" id="pesquisa" class="form-control" placeholder="Ex: Gaia">
            </div>
            <p class="small text-body-secondary mb-2" id="contagem"></p>

            <div id="resultados" class="list-group"></div>
        </main>

        <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
            <div id="aviso" class="toast align-items-center" role="status" aria-live="polite" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body d-flex align-items-center gap-2">
                        <i class="bi bi-check-circle-fill text-success" aria-hidden="true"></i>
                        <span id="avisoTexto"></span>
                    </div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
                </div>
            </div>
        </div>
        <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="modalTitulo"></h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body" id="modalTexto"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Voltar</button>
                        <button type="button" class="btn btn-boleia" id="modalConfirmar"></button>
                    </div>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../script.js"></script>
    <script src="../js/boleias.js"></script>
    </body>
</html>
