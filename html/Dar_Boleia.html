<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dar Boleia</title>
        <link rel="stylesheet" href="../style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"> 
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">BoleiaISEP</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Dar Boleia</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Boleias.html">Boleias</a>
                        </li>
                    </ul>
                    <a class="login" href="Login.html">
                        <span class="avatar avatar-sm" style="background:#a6192e" aria-hidden="true">HC</span>
                    </a>
                </div>
            </div>
        </nav>

        <main class="container mt-4">
            <form id="formBoleia">
                <div class="row g-3 mt-3">
                    <div class="col">
                        <label class="form-label" for="nome">Nome</label>
                        <input type="text" required class="form-control" id="nome" placeholder="Escreve o teu nome" aria-label="First name">
                    </div>
                    <div class="col">
                        <label class="form-label" for="apelido">Apelido</label>
                        <input type="text" required id="apelido" class="form-control" placeholder="Escreve o teu apelido" aria-label="Last name">
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label" for="origem">Origem</label>
                    <input type="text" required id="origem" class="form-control" placeholder="Local de Origem">
                </div>
                <div class="mt-3">
                    <label for="hora" class="form-label">Hora de partida</label>
                        <input type="time" id="hora" class="form-control"
                            min="06:00" max="23:00" step="900" required>
                </div>
                <div class="mt-3">
                    <label for="lugares" class="form-label">Número de lugares</label>
                    <select id="lugares" class="form-select" required>
                        <option value="">-------</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>
                <div>
                    <label for="preco" class="form-label">Preço por pessoa (máx 10€)</label>
                    <div class="input-group">
                        <input type="number" id="preco" class="form-control"
                            min="0" max="10" step="0.10" inputmode="decimal" required>
                        <span class="input-group-text">€</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-danger mt-4">Publicar</button>
            </form>
        </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/darBoleia.js"></script>
    <script src="../script.js"></script>
    </body>
</html>
