<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <script>
            const tema = localStorage.getItem("tema") ?? "light";
            document.documentElement.setAttribute("data-bs-theme", tema);
        </script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="icon" type="image/png" href="../img/favicon.png">
        <link rel="stylesheet" href="../style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">BoleiaISEP</a>
                <button type="button" class="btn btn-link nav-link px-2 ms-auto order-lg-last" id="alternarTema" aria-label="Mudar para modo escuro">
                    <i class="bi bi-moon" id="iconeTema" aria-hidden="true"></i>
                </button>
                <a class="login me-2 order-lg-last" href="Login.html" aria-label="Entrar">
                    <span class="avatar avatar-sm avatar-login" aria-hidden="true">Login</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="Dar_Boleia.html">Dar Boleia</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Boleias.html">Boleias</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Minhas_Viagens.html">As minhas viagens</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Sobre.html">Sobre nós</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="login-container container d-flex justify-content-center align-items-center">
            <div class="login-card card shadow-sm">
                <div class="card-body p-5 d-flex flex-column">
                    <div class="text-center mb-4">
                        <h1 class="h4 mb-1">Entrar no BoleiaISEP</h1>
                        <p class="text-body-secondary mb-0">Usa a tua conta do ISEP</p>
                    </div>
                    <form id="formLogin" class="d-flex flex-column justify-content-center flex-grow-1">
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-envelope-at" aria-hidden="true"></i></span>
                            <div class="form-floating">
                                <input type="email" class="form-control" id="email" placeholder="email" pattern=".+@isep\.ipp\.pt" title="Usa o teu email do ISEP (@isep.ipp.pt)" autocomplete="email" required>
                                <label for="email">Email do ISEP</label>
                            </div>
                        </div>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                            <div class="form-floating">
                                <input type="password" class="form-control" id="pwd" placeholder="palavra-passe" autocomplete="current-password" required>
                                <label for="pwd">Palavra-passe</label>
                            </div>
                            <button type="button" class="btn btn-outline-secondary" id="mostrarPwd" aria-label="Mostrar palavra-passe">
                                <i class="bi bi-eye" id="iconeOlho" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="form-check  mt-2 mb-3">
                            <input class="form-check-input" type="checkbox" id="lembrar">
                            <label class="form-check-label" for="lembrar">Manter sessão iniciada</label>
                        </div>
                        <div class="form-check mb-5">
                            <input class="form-check-input" type="checkbox" id="termos" required>
                            <label class="form-check-label" for="termos">Li e aceito os <a href="Termos.html" target="_blank">termos de utilização</a></label>
                        </div>
                        <div id="erroLogin" class="alert alert-danger d-none" role="alert"></div>
                        <button type="submit" id="enviarLogin" class="btn btn-boleia w-100 py-2">Entrar</button>
                    </form>
                </div>
            </div>
        </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="../script.js"></script>
    <script src="../js/login.js"></script>
    </body>
</html>
